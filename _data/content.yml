projects:
  - title: Home SOC lab
    status: running
    tools: Splunk, Elastic, TheHive, Sysmon, Kali
    purpose: Build repeatable incident-investigation and detection practice across Windows and Linux telemetry.
    built: "A four-VM environment: Windows Server with Sysmon, PowerShell script-block logging and Security event logging; Ubuntu with auditd and journald; Kali; and an analyst workstation. Winlogbeat and Filebeat ship to Elastic while a Splunk Universal Forwarder sends the same events to Splunk."
    evidence: Each scenario begins with a hypothesis and intentionally generated activity. I investigate without a preloaded search, save the resulting SPL and KQL, map the behavior to ATT&CK, and record detection gaps before tuning.
    limitation: Lab scale does not reproduce the event volume, background noise or access constraints of an enterprise SOC.
    next_step: Complete the Active Directory build-out, investigate original Kerberoasting and DCSync scenarios, and publish sanitized findings.
  - title: Detection notebook and ATT&CK coverage map
    status: growing
    tools: SPL, KQL, MITRE ATT&CK
    purpose: Track detection coverage, expose weak assumptions and choose the next lab from evidence rather than familiarity.
    built: A structured record for each detection, with separate entries for chained detections that combine weak signals into a higher-confidence alert.
    evidence: Each entry records the ATT&CK technique, log source, SPL or KQL, known blind spots, false positives found during tuning and validation notes.
    limitation: Coverage currently reflects controlled lab scenarios, not production validation.
    next_step: Publish sanitized, independently created entries alongside completed portfolio investigations.
  - title: Operational anomaly analytics platform
    status: shipped
    tools: Python, Streamlit, SQLite, pandas
    purpose: Turn messy operational data into ranked, explainable exceptions that the right person can act on.
    built: A Python, Streamlit, SQLite and pandas workflow that normalizes multiple inputs, applies graded rules with documented exclusions, surfaces repeat patterns and produces a weekly leadership brief.
    evidence: The platform was shipped into a 24/7 operation. Its transferable security value is the detection-engineering loop—normalize, detect, rank, route, document and measure follow-through.
    limitation: Employer data, internal screens, source code, metrics and implementation details are private and will not be published.
    next_step: Recreate the generic workflow with synthetic data before sharing a public demonstration.
