<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Example lab topology</title><desc id="desc">An activity generator sends events through two log sources to a collector and analyst workstation.</desc>
