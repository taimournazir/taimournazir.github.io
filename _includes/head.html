<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% assign page_description = page.description | default: site.description %}
{% assign social_image = page.social_image | default: site.social_image %}
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page_description | strip_html | escape }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page_description | strip_html | escape }}">
<meta property="og:type" content="{% if page.collection %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% if social_image %}<meta property="og:image" content="{{ social_image | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Taimour Nazir — Every shift is triage. Security analyst and blue-team portfolio.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta name="twitter:description" content="{{ page_description | strip_html | escape }}">
<meta name="twitter:image" content="{{ social_image | absolute_url }}">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }} feed" href="{{ '/feed.xml' | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
