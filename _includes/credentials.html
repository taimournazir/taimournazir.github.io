<ul class="credential-list">
  {% for cert in site.data.content.certifications.earned %}
  <li>
    <a class="credential" href="{{ cert.verify }}" aria-label="Verify {{ cert.name }} on Credly">
      <img src="{{ cert.badge | relative_url }}" alt="{{ cert.name }} digital badge" width="96" height="96" loading="lazy">
      <span class="credential-copy"><strong>{{ cert.name }}</strong><span>{{ cert.issuer }} · Earned</span><span class="verify">Verify credential →</span></span>
    </a>
  </li>
  {% endfor %}
</ul>
